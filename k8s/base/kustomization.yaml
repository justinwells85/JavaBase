apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: javabase

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: javabase
  app.kubernetes.io/managed-by: kustomize

images:
  - name: javabase
    newName: ghcr.io/justinwells85/javabase
    newTag: latest
