global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # JavaBase application (when running in Docker)
  - job_name: 'javabase-docker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['javabase-app:8080']
        labels:
          environment: 'docker'

  # JavaBase application (when running locally on host)
  - job_name: 'javabase-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          environment: 'local'

  # PostgreSQL (via postgres_exporter if added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # RabbitMQ (built-in prometheus plugin)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['javabase-rabbitmq:15692']
