spring:
  application:
    name: javabase

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javabase}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Spring Cloud Stream Configuration
  cloud:
    stream:
      bindings:
        taskEventsOut-out-0:
          destination: javabase.task.events
          content-type: application/json
        taskEventsIn-in-0:
          destination: javabase.task.events
          group: javabase-consumer
          content-type: application/json
      rabbit:
        bindings:
          taskEventsOut-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: headers['routingKey']
          taskEventsIn-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: task.#

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

# API Configuration
api:
  base-path: /api
  version:
    current: v1
    supported:
      - v1
    deprecated: []
    sunset-policy-days: 90

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
    instances:
      externalService:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
    instances:
      externalService:
        baseConfig: default

  ratelimiter:
    configs:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
    instances:
      externalService:
        baseConfig: default

# Outbox Configuration
outbox:
  polling:
    interval-ms: ${OUTBOX_POLLING_INTERVAL:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}

# Idempotency Configuration
idempotency:
  ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  cleanup:
    interval-ms: ${IDEMPOTENCY_CLEANUP_INTERVAL:3600000}

# Logging Configuration (structured JSON in production)
logging:
  level:
    root: INFO
    com.justinwells.javabase: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
