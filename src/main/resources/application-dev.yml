# Development Profile Configuration
# Use with: --spring.profiles.active=dev

spring:
  # Enable H2 console for development
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA - Show SQL for debugging
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Liquibase
  liquibase:
    contexts: dev

# Actuator - Expose all endpoints in dev
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Springdoc - Enable in dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Verbose logging in development
logging:
  level:
    root: INFO
    com.justinwells.javabase: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Disable security for development (optional - uncomment if needed)
# app:
#   security:
#     enabled: false
